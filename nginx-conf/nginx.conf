
server {
        listen 7890 ssl;
        listen [::]:7890 ssl;
        http2 on;
        server_name vaultwarden-nginx;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        location / {
                proxy_pass http://vaultwarden:80;
                add_header Upgrade $http_upgrade;
        }
}
