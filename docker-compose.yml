services:
  webserver:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:7890:7890"
    volumes:
      - ./nginx-conf/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ./nginx-conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs
    depends_on:
      - vaultwarden
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:7890/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  vaultwarden:
    hostname: vaultwarden
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://internal.cam-davis.com"
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
    volumes:
      - ./vw-data/:/data/
    expose:
      - 80
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  default:
